name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看[已知问题与限制](https://github.com/fhb263/obsidian-reelludic#known-issues)——
        有些想法（虚拟滚动、撤销机制、端到端测试等）已经在计划中，重复提出会被合并。

  - type: dropdown
    id: category
    attributes:
      label: 建议类别
      description: 选一个最接近的方向
      options:
        - 元数据抓取（新增数据源 / 字段）
        - 书架与视图（海报墙 / 列表 / 瀑布流）
        - 阅读器与播放器
        - 计划表与追更
        - 统计与报告
        - 笔记与双链 / Dataview
        - 设置与数据管理
        - 界面与可访问性
        - 性能
        - 其他
    validations:
      required: true

  - type: dropdown
    id: entry-type
    attributes:
      label: 涉及的类型
      description: 可多选
      multiple: true
      options:
        - 电影 / 电视剧
        - 动画
        - 书籍
        - 游戏
        - 音乐
        - 与类型无关
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述你实际遇到的场景或不便，而不是直接跳到方案
      placeholder: 当我在……的时候，我需要……，但现在只能……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 如果想到过具体做法，写在这里（可选）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代做法
      description: 例如用其他插件配合、用模板绕开等（可选）
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: 提交前请逐项确认
      options:
        - label: 我已搜索现有 Issue 与「已知问题与限制」，确认这不是重复或已在计划中的事项
          required: true
        - label: 我愿意在方案确定后参与测试或提交 PR
          required: false
