name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说说你想让 ReelLudic 变成什么样。

  - type: dropdown
    id: category
    attributes:
      label: 涉及版块
      description: 按「关于 → 未来规划」里的九个版块选一个最接近的
      options:
        - 搜索添加
        - 视图编辑
        - 播放阅读
        - 计划追踪
        - 统计报告
        - AI 赋能
        - 插件设置
        - 数据管理
        - 生态联动
    validations:
      required: true

  - type: dropdown
    id: entry-type
    attributes:
      label: 涉及的类型
      description: 可多选
      multiple: true
      options:
        - 电影 / 电视剧
        - 动画
        - 书籍
        - 游戏
        - 音乐
        - 与类型无关
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述你实际遇到的场景或不便，而不是直接跳到方案
      placeholder: 当我在……的时候，我需要……，但现在只能……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 如果想到过具体做法，写在这里（可选）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代做法
      description: 例如用其他插件配合、用模板绕开等（可选）
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: 提交前请确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议
          required: true
